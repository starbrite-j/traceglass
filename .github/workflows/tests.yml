name: Tests and synthetic import

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise real import and HTTP APIs with 64 MiB of invented data
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python scripts/benchmark_large_import.py --workspace data/ci-64mib --size-mib 64
      - name: Trace cross-chat references and siblings through 80,000 invented records
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python scripts/benchmark_relationships.py --workspace data/ci-connected-80k --records 80000
      - name: Verify streaming of one conversation and read-only consistency
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python scripts/benchmark_streaming_conversation.py --workspace data/ci-single-conversation --records 2000 --chars 8192
